site_name: Guías de compilación a ARM64
site_description: Material de apoyo para la conferencia sobre compiladores con Go, ANTLR y ARM64/AArch64
site_author: Conferencia OLC2

theme:
  name: material
  language: es
  icon:
    logo: material/book-open-page-variant
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Inicio: index.md
  - Preparación del entorno: guia-instalacion.md
  - Lenguaje V-Lang Cherry: sintaxis-vlang-cherry.md
  - ANTLR, CST y patrón Visitor: antlr-cst-visitor.md
  - ARM64 / AArch64: arm64-memoria-registros.md

plugins:
  - search:
      lang: es

extra:
  generator: false

copyright: Material de apoyo académico · Conferencia OLC2
