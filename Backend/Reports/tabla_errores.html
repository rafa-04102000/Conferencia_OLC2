<!DOCTYPE html>
	<html lang="es">
	<head>
		<meta charset="UTF-8">
		<title>Reporte de Errores</title>
		<!-- Material Icons -->
		<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
		<!-- Materialize CSS -->
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
		<!-- Google Fonts - Roboto -->
		<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
		<style>
			body {
				font-family: 'Roboto', sans-serif;
				background-color: #f5f5f5;
			}
			.header {
				background: linear-gradient(135deg, #ff6a00 0%, #ee0979 100%);
				color: white;
				padding: 2rem 0;
				margin-bottom: 2rem;
				border-radius: 0 0 20px 20px;
				box-shadow: 0 4px 20px rgba(0,0,0,0.12);
			}
			.card-panel {
				border-radius: 10px;
				box-shadow: 0 4px 20px rgba(0,0,0,0.12);
			}
			th {
				background-color: #ee0979 !important;
				color: white !important;
				font-weight: 500;
			}
			.error-lexical {
				color: white;
				background-color: #ff5722;
				padding: 4px 10px;
				border-radius: 8px;
				font-size: 0.8rem;
				text-transform: uppercase;
			}
			.error-syntax {
				color: white;
				background-color: #fbc02d;
				padding: 4px 10px;
				border-radius: 8px;
				font-size: 0.8rem;
				text-transform: uppercase;
			}
			.error-semantic {
				color: white;
				background-color: #2196f3;
				padding: 4px 10px;
				border-radius: 8px;
				font-size: 0.8rem;
				text-transform: uppercase;
			}
			.error-runtime {
				color: white;
				background-color: #9c27b0;
				padding: 4px 10px;
				border-radius: 8px;
				font-size: 0.8rem;
				text-transform: uppercase;
			}
		</style>
	</head>
	<body>

		<div class="header center-align">
			<h3 class="white-text">Reporte de Errores</h3>
			<p class="flow-text white-text">Errores encontrados durante la ejecución</p>
		</div>

		<div class="container">
			<div class="card-panel">
				<table class="highlight centered responsive-table">
					<thead>
						<tr>
							<th>#</th>
							<th>Descripción</th>
							<th>Línea</th>
							<th>Columna</th>
							<th>Tipo</th>
						</tr>
					</thead>
					<tbody>
						<tr>
							<td>1</td>
							<td>no viable alternative at input 'ssprintln'</td>
							<td>8</td>
							<td>1</td>
							<td><span class="error-syntax">Error sintáctico</span></td>
						</tr>
						<tr>
							<td>2</td>
							<td>Sentencia desconocida: </td>
							<td>0</td>
							<td>0</td>
							<td><span class="error-semantic">Error semántico</span></td>
						</tr>
						<tr>
							<td>3</td>
							<td>Sentencia desconocida: ss</td>
							<td>0</td>
							<td>0</td>
							<td><span class="error-semantic">Error semántico</span></td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

		<footer class="page-footer pink lighten-5">
			<div class="container">
				<div class="row center-align">
					<p class="pink-text text-darken-2">Conferencia Compiladores 2</p>
				</div>
			</div>
		</footer>

		<!-- Materialize JS -->
		<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
	</body>
	</html>
